name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The conformance suite runs one spec against every driver, but it skips
    # Postgres unless TEST_DATABASE_URL points at a real server — a fake would
    # prove nothing about the dialect, which is the entire risk. Without this
    # service the suite passes while exercising no Postgres code, which is the
    # failure mode ENT-6754 existed to kill, one layer down. The suite itself
    # refuses to skip the driver when CI is set, so a service that fails to come
    # up is a red build rather than a quietly narrower one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scimtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Proves the gate above can actually fail (ENT-6754: for months it could not).
      - run: npm run typecheck:gate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/scimtest
      - run: npm run build
