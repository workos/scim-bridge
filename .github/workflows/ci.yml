name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Proves the gate above can actually fail (ENT-6754: for months it could not).
      - run: npm run typecheck:gate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
