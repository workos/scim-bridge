services:
  scim-bridge:
    build: .
    image: ghcr.io/workos/scim-bridge:latest
    # Published on every interface, so whatever is on the other end of this port
    # is reachable by anything that can route to the host. That is the point for
    # /scim/v2 — your IdP has to reach it — and the reason /panel must be
    # authenticated.
    ports:
      - "8080:8080"
    # Copy .env.example to .env and fill it in. PANEL_AUTH_USER and
    # PANEL_AUTH_PASSWORD are required: the container refuses to start without
    # them, because /panel renders every directory's native and WorkOS bearer
    # tokens. Set PANEL_AUTH_DISABLED=true instead only when something in front
    # of the bridge already authenticates it.
    env_file:
      - path: .env
        required: false
    environment:
      # The database lives on the named volume below; keep this pointed at it.
      DATABASE_PATH: /data/scim-bridge.db
    volumes:
      - scim-bridge-data:/data
    restart: unless-stopped

volumes:
  scim-bridge-data:
