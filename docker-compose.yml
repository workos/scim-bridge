services:
  scim-bridge:
    build: .
    image: ghcr.io/workos/scim-bridge:latest
    ports:
      - "8080:8080"
    # Copy .env.example to .env and fill it in; this block is optional.
    env_file:
      - path: .env
        required: false
    environment:
      # The database lives on the named volume below; keep this pointed at it.
      DATABASE_PATH: /data/scim-bridge.db
    volumes:
      - scim-bridge-data:/data
    restart: unless-stopped

volumes:
  scim-bridge-data:
